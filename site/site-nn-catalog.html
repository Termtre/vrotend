<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ювелирный магазин ОГРАНКА</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

<header>
  <section class="left-nav">
    <a href="#" class="nav-item">Магазины</a>
    <a href="#" class="nav-item">Доставка и оплата</a>

    <div class="city-container">

      <span class="nav-item">
        Нижний Новгород
      </span>

      <div class="city-choice">

        <div class="cities-grid">

          <a href="main.html" class="nav-item">
            <img src="images/diamond.svg" width="20" height="20" alt="Флагманский магазин">
            Нижний Новгород</a>
          <a href="#" class="nav-item">Дзержинск</a>
          <a href="#" class="nav-item">Кстово</a>
          <a href="#" class="nav-item">Арзамас</a>
          <a href="#" class="nav-item">Богородск</a>
          <a href="#" class="nav-item">Павлово</a>

        </div> <!-- cities-grid -->

      </div> <!-- city-choice -->

    </div> <!-- city-container -->

  </section> <!-- left-nav -->

  <a href="main.html" class="logo">
  <img src="images/logo.png" alt="Логотип ОГРАНКА" class="logo-icon">
  ОГРАНКА
  </a>

  <div class="contact-info">

    <a href="tel:#" class="nav-item">8 895 341 676</a>
    <a href="#" class="nav-item">Украшения на заказ</a>
    <a href="#" class="icon-link">
      <img src="images/heart.svg" alt="Избранное" width="20" height="20">
    </a>
    <a href="#" class="icon-link">
      <img src="images/basket.svg" alt="Корзина" width="20" height="20">
    </a>
    <a href="#" class="icon-link">
      <img src="images/enter.svg" alt="Вход в аккаунт" width="20" height="20">
    </a>

  </div> <!-- contact-info -->

  <div class="main-nav">

    <a href="main.html" class="catalog-btn">
      <img src="images/cross.svg" alt="Каталог" width="24" height="24">
      КАТАЛОГ
    </a>

    <div class="search-container">

      <img src="images/search.svg" alt="Поиск" width="24" height="24" class="search-icon">
      <input type="text" class="search-input" placeholder="Поиск по каталогу">

    </div> <!-- search-container -->
    
    <div class="bottom-nav">

        <a href="#" class="nav-item">Акции</a>
        <a href="#" class="nav-item">Подарочная карта</a>

    </div> <!-- bottom-nav -->

  </div> <!-- main-nav -->

</header>

<main>
  <div class="catalog-section">

    <div class="sidebar">

      <a href="site-nn-catalog.html" class="nav-item">
        <img src="images/ring.png" alt="Украшения">
        Украшения
      </a> <!-- nav-item -->

      <a href="site-nn-catalog-materials.html" class="nav-item">
        <img src="images/material.png" alt="Материал">
        Материал
      </a> <!-- nav-item -->

      <a href="#" class="nav-item">
        <img src="images/del.png" alt="Украшения на заказ">
        Украшения на заказ
      </a> <!-- nav-item -->

    </div> <!-- sidebar -->

    <div id="categories" class="categories-grid">

      <a href="#" class="category-item">
        <span>Все украшения</span>
        <img src="images/1.png" alt="Все украшения">
      </a>

      <a href="#" class="category-item">
        <span>Кольца</span>
        <img src="images/2.png" alt="Кольца">
      </a>
      
      <a href="#" class="category-item">
        <span>Серьги</span>
        <img src="images/3.png" alt="Серьги">
      </a>
      
      <a href="#" class="category-item">
        <span>Цепи</span>
        <img src="images/4.png" alt="Цепи">
      </a>
      
      <a href="#" class="category-item">
        <span>Подвески</span>
        <img src="images/5.png" alt="Подвески">
      </a>

      <a href="#" class="category-item">
        <span>Браслеты</span>
        <img src="images/6.png" alt="Браслеты">
      </a>

      <a href="#" class="category-item">
        <span>Колье</span>
        <img src="images/7.png" alt="Колье">
      </a>
    </div>

  </div> <!-- catalog-section -->
</main>
</body>
</html>
