<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Формы</title>
  </head>
    <body>
        <h1>Формы</h1>
        <form method="post" action="/contact">
            <fieldset>
                <legend>Основная информация</legend>
                <p>
                    <label for="username">Имя пользователя:</label><br>
                    <input type="text" id="username" name="username" size="30">
                </p>
                <p>
                    <label for="password">Пароль:</label><br>
                    <input type="password" id="password" name="password" size="20">
                </p>
                <p>
                    <label for="comments">Комментарии:</label><br>
                    <textarea id="comments" name="comments" rows="5" cols="40">Введите ваш комментарий здесь</textarea>
                </p>
            </fieldset>
            <fieldset>
                <legend>Выбор параметров</legend>
                <p>Выберите параметр:</p>
                <p>
                    <input type="radio" id="param1" name="param" value="param1">
                    <label for="param1">Параметр 1</label><br>
                    <input type="radio" id="param2" name="param" value="param2">
                    <label for="param2">Параметр 2</label><br>
                    <input type="radio" id="param3" name="param" value="param3">
                    <label for="param3">Параметр 2</label><br>
                </p>
                <p>
                    <input type="checkbox" id="check1" name="check" value="yes" checked>
                    <label for="check1">Чекбокс1</label>
                    <input type="checkbox" id="check2" name="check" value="no">
                    <label for="check2">Чекбокс2</label>
                </p>
                <input type="hidden" name="form_version" value="1.0">
            </fieldset>
            <fieldset>
                <legend>Списки выбора</legend>
                <p>
                    <label for="country">Страна:</label><br>
                    <select id="country" name="country">
                        <optgroup label="Европа">
                            <option value="ru" selected>Россия</option>
                            <option value="de">Германия</option>
                            <option value="fr">Франция</option>
                        </optgroup>
                        <optgroup label="Азия">
                            <option value="jp">Япония</option>
                            <option value="cn">Китай</option>
                        </optgroup>
                    </select>
                </p>
                <p>
                    <label for="interests">Интересы:</label><br>
                    <select id="interests" name="interests" size="3" multiple width="100" height="100">
                        <option value="sports">Спорт</option>
                        <option value="music">Музыка</option>
                        <option value="books">Книги</option>
                        <option value="travel">Путешествия</option>
                        <option value="tech">Технологии</option>
                    </select>
                </p>
            </fieldset>
            <fieldset>
                <legend>Файлы и изображения</legend>
                <p>
                    <label for="avatar">Загрузить файл:</label><br>
                    <input type="file" id="avatar" name="avatar" accept="*">
                </p>
                <p>
                    <input type="image" src="logo.png" name="submit_image" alt="Отправить форму" width="50" height="50">
                </p>
            </fieldset>
            <fieldset>
                <legend>Кнопки управления</legend>
                <p>
                    <input type="button" id="test_button" value="Нажми меня" disabled>
                </p>
                <p>
                    <button type="button" name="img_button" id="img_button" value="отправить">
                        <img src="logo.png" alt="Иконка" width="30" height="30">
                    </button>
                </p>
                <p>
                    <input type="submit" value="Отправить форму">
                    <input type="reset" value="Очистить форму">
                </p>
            </fieldset>
        </form>
        <hr>
        <h2>Поиск:</h2>
        <isindex prompt="Введите текст для поиска: ">
        <hr>
        <form action="/search" method="get">
            <p>
                <label for="search">Поиск:</label><br>
                <input type="text" id="search" name="search" size="40">
                <input type="submit" value="Искать">
            </p>
        </form>
    </body>
</html>
